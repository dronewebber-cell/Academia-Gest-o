<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Fitness Culture - Gestão de Alunos</title>
    <style>
        :root {
            --primary: #2563eb;
            --primary-dark: #1d4ed8;
            --bg-color: #0f172a;
            --card-bg: #1e293b;
            --text-color: #f8fafc;
            --text-muted: #94a3b8;
            --danger: #ef4444;
            --success: #22c55e;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }

        body {
            background-color: var(--bg-color);
            color: var(--text-color);
            padding: 20px;
        }

        .container {
            max-width: 800px;
            margin: 0 auto;
        }

        header {
            text-align: center;
            margin-bottom: 30px;
        }

        header h1 {
            font-size: 1.8rem;
            color: #38bdf8;
            margin-bottom: 5px;
        }

        .card {
            background-color: var(--card-bg);
            padding: 20px;
            border-radius: 12px;
            box-shadow: 0 4px 6px rgba(0, 0, 0, 0.3);
            margin-bottom: 20px;
        }

        h2 {
            font-size: 1.2rem;
            margin-bottom: 15px;
            border-bottom: 2px solid #334155;
            padding-bottom: 8px;
        }

        .form-group {
            margin-bottom: 12px;
        }

        label {
            display: block;
            font-size: 0.9rem;
            color: var(--text-muted);
            margin-bottom: 5px;
        }

        input {
            width: 100%;
            padding: 10px;
            border-radius: 6px;
            border: 1px solid #475569;
            background-color: #0f172a;
            color: #fff;
            font-size: 1rem;
        }

        button {
            background-color: var(--primary);
            color: white;
            border: none;
            padding: 12px;
            width: 100%;
            border-radius: 6px;
            font-size: 1rem;
            font-weight: bold;
            cursor: pointer;
            transition: background 0.2s;
        }

        button:hover {
            background-color: var(--primary-dark);
        }

        .student-list {
            list-style: none;
        }

        .student-item {
            background-color: #0f172a;
            padding: 12px;
            border-radius: 8px;
            margin-bottom: 10px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            border-left: 5px solid var(--success);
        }

        .student-item.devedor {
            border-left-color: var(--danger);
        }

        .student-info h3 {
            font-size: 1rem;
            margin-bottom: 3px;
        }

        .student-info p {
            font-size: 0.8rem;
            color: var(--text-muted);
        }

        .badge {
            padding: 4px 8px;
            border-radius: 4px;
            font-size: 0.75rem;
            font-weight: bold;
            text-transform: uppercase;
        }

        .badge.pago {
            background-color: rgba(34, 197, 94, 0.2);
            color: var(--success);
        }

        .badge.devendo {
            background-color: rgba(239, 68, 68, 0.2);
            color: var(--danger);
        }
    </style>
</head>
<body>

    <div class="container">
        <header>
            <h1>Fitness Culture</h1>
            <p>Gestão de Alunos</p>
        </header>

        <!-- Formulário de Cadastro -->
        <div class="card">
            <h2>Adicionar Novo Aluno</h2>
            <form id="student-form">
                <div class="form-group">
                    <label for="name">Nome do Aluno</label>
                    <input type="text" id="name" required placeholder="Digite o nome completo">
                </div>
                <div class="form-group">
                    <label for="duedate">Data de Vencimento do Pagamento</label>
                    <input type="date" id="duedate" required>
                </div>
                <button type="submit">Cadastrar Aluno</button>
            </form>
        </div>

        <!-- Lista de Alunos -->
        <div class="card">
            <h2>Lista de Alunos</h2>
            <ul id="students-list" class="student-list">
                <!-- Os alunos salvos aparecem aqui dinamicamente -->
            </ul>
        </div>
    </div>

    <!-- Scripts do Firebase SDK (Versão Modular) -->
    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-app.js";
        import { getFirestore, collection, addDoc, getDocs } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-firestore.js";

        // TODO: Cole aqui as configurações do seu Firebase quando configurar no console
        const firebaseConfig = {
            apiKey: "SUA_API_KEY",
            authDomain: "SEU_AUTH_DOMAIN",
            projectId: "SEU_PROJECT_ID",
            storageBucket: "SEU_STORAGE_BUCKET",
            messagingSenderId: "SEU_MESSAGING_SENDER_ID",
            appId: "SEU_APP_ID"
        };

        // Inicializa o Firebase
        const app = initializeApp(firebaseConfig);
        const db = getFirestore(app);

        const form = document.getElementById('student-form');
        const studentsListEl = document.getElementById('students-list');

        // Função para carregar os alunos salvos no Firestore
        async function loadStudents() {
            studentsListEl.innerHTML = '<p style="text-align:center; color:#94a3b8;">Carregando alunos...</p>';
            try {
                const querySnapshot = await getDocs(collection(db, "alunos"));
                studentsListEl.innerHTML = '';
                
                if (querySnapshot.empty) {
                    studentsListEl.innerHTML = '<p style="text-align:center; color:#94a3b8;">Nenhum aluno cadastrado.</p>';
                    return;
                }

                const hoje = new Date();
                hoje.setHours(0, 0, 0, 0); // Zera as horas para comparar apenas a data

                querySnapshot.forEach((doc) => {
                    const aluno = doc.data();
                    
                    // Compara a data de vencimento com a data de hoje
                    const dataVencimentoParts = aluno.dueDate.split('-');
                    const dataVencimento = new Date(dataVencimentoParts[0], dataVencimentoParts[1] - 1, dataVencimentoParts[2]);
                    
                    const isAtrasado = hoje > dataVencimento;

                    const li = document.createElement('li');
                    li.className = `student-item ${isAtrasado ? 'devedor' : ''}`;
                    
                    li.innerHTML = `
                        <div class="student-info">
                            <h3>${aluno.name}</h3>
                            <p>Vencimento: ${dataVencimento.toLocaleDateString('pt-BR')}</p>
                        </div>
                        <div>
                            <span class="badge ${isAtrasado ? 'devendo' : 'pago'}">
                                ${isAtrasado ? 'Inadimplente' : 'Em Dia'}
                            </span>
                        </div>
                    `;
                    studentsListEl.appendChild(li);
                });
            } catch (error) {
                console.error("Erro ao carregar alunos: ", error);
                studentsListEl.innerHTML = '<p style="text-align:center; color:#ef4444;">Erro ao carregar dados do Firebase.</p>';
            }
        }

        // Evento de envio do formulário para salvar no Firebase
        form.addEventListener('submit', async (e) => {
            e.preventDefault();
            const name = document.getElementById('name').value;
            const dueDate = document.getElementById('duedate').value;

            try {
                await addDoc(collection(db, "alunos"), {
                    name: name,
                    dueDate: dueDate,
                    createdAt: new Date().toISOString()
                });
                form.reset();
                loadStudents();
            } catch (e) {
                console.error("Erro ao adicionar aluno: ", e);
                alert("Erro ao salvar o aluno. Verifique a configuração do Firebase.");
            }
        });

        // Carrega os alunos ao abrir a página
        loadStudents();
    </script>
</body>
</html>
